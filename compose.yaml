services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teampulse
      POSTGRES_USER: teampulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Localhost only: lets the host-run app and the SQLite copy reach it.
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teampulse"]
      interval: 5s
      retries: 10
  app:
    build: .
    # One container, one process: exactly one check-in tick (docs/PILOT_RUNBOOK.md).
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      DATABASE_URL: postgresql+psycopg://teampulse:${POSTGRES_PASSWORD}@db:5432/teampulse
      SEED_COMPANY: ${SEED_COMPANY:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FLODATA_ISSUER: ${FLODATA_ISSUER:-https://fda-sso.duckdns.org}
      FLODATA_CLIENT_ID: ${FLODATA_CLIENT_ID:-teampulse}
      FLODATA_CLIENT_SECRET: ${FLODATA_CLIENT_SECRET:?Set FLODATA_CLIENT_SECRET in .env}
      # The address people open this container at; its /auth/callback must be registered in the FloData Auth console.
      FLODATA_APP_URL: ${FLODATA_APP_URL:-http://localhost:8787}
      FLODATA_SERVER_URL: ${FLODATA_SERVER_URL:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-flodataanalytics.com}
      APP_URL: ${APP_URL:-http://127.0.0.1:8787}
      GOOGLE_CHAT_AUDIENCE: ${GOOGLE_CHAT_AUDIENCE:-}
      GOOGLE_CHAT_SERVICE_ACCOUNT_FILE: ${GOOGLE_CHAT_SERVICE_ACCOUNT_FILE:+/run/secrets/google-chat.json}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8787,http://localhost:8787}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      # Speech-to-text for Google Chat voice notes (same provider; Groq Whisper by default).
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-}
      # Proactive assistant (docs/PROACTIVE_ASSISTANT_PLAN.md): off, and in dry run, unless .env says otherwise.
      PROACTIVE_ENABLED: ${PROACTIVE_ENABLED:-false}
      PROACTIVE_DRY_RUN: ${PROACTIVE_DRY_RUN:-true}
      PROACTIVE_PILOT_EMAILS: ${PROACTIVE_PILOT_EMAILS:-}
      ORG_TIMEZONE: ${ORG_TIMEZONE:-}
      CHECKIN_HOUR: ${CHECKIN_HOUR:-10}
      CHECKIN_MAX_ITEMS: ${CHECKIN_MAX_ITEMS:-4}
      UNDO_WINDOW_MINUTES: ${UNDO_WINDOW_MINUTES:-120}
    volumes:
      # Chat service-account key, read-only. Requires GOOGLE_CHAT_SERVICE_ACCOUNT_FILE in .env; remove this line if you do not use Google Chat.
      - ${GOOGLE_CHAT_SERVICE_ACCOUNT_FILE}:/run/secrets/google-chat.json:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
