services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: teampulse
      POSTGRES_USER: teampulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teampulse"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      DATABASE_URL: postgresql+psycopg://teampulse:${POSTGRES_PASSWORD}@db:5432/teampulse
      SEED_COMPANY: ${SEED_COMPANY:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8787,http://localhost:8787}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
