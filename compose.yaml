services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: teampulse
      POSTGRES_USER: teampulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Localhost only: lets the host-run app and the SQLite copy reach it.
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teampulse"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      DATABASE_URL: postgresql+psycopg://teampulse:${POSTGRES_PASSWORD}@db:5432/teampulse
      SEED_COMPANY: ${SEED_COMPANY:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-flodataanalytics.com}
      APP_URL: ${APP_URL:-http://127.0.0.1:8787}
      GOOGLE_CHAT_AUDIENCE: ${GOOGLE_CHAT_AUDIENCE:-}
      GOOGLE_CHAT_SERVICE_ACCOUNT_FILE: ${GOOGLE_CHAT_SERVICE_ACCOUNT_FILE:+/run/secrets/google-chat.json}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8787,http://localhost:8787}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      # Mount the Chat service-account key read-only when GOOGLE_CHAT_SERVICE_ACCOUNT_FILE is set:
      # - ${GOOGLE_CHAT_SERVICE_ACCOUNT_FILE}:/run/secrets/google-chat.json:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
